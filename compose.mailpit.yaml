# Optional, isolated local mail inbox. Does not start or migrate the application.
services:
  mailpit:
    image: axllent/mailpit:v1.27.10
    profiles: [mail]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
