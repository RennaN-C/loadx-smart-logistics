services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loadx_test
      POSTGRES_USER: loadx_test
      POSTGRES_PASSWORD: loadx_test_local
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadx_test -d loadx_test"]
      interval: 2s
      timeout: 5s
      retries: 15
