name: Ocorrência de funcionalidade
description: Criar ou alterar uma funcionalidade do LoadX
title: "[OCXX] "
labels: ["feature"]
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Descreva o resultado esperado.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: Liste condições objetivas para concluir a ocorrência.
    validations:
      required: true
  - type: textarea
    id: dependencias
    attributes:
      label: Dependências
      description: Informe outras ocorrências, contratos ou módulos necessários.
