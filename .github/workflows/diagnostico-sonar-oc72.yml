name: Diagnóstico Sonar OC72

on:
  push:
    branches:
      - marlon/oc72-disponibilidade-caminhoes-motoristas

permissions:
  contents: read

jobs:
  sonar-duplication:
    name: Ler duplicação do Sonar
    runs-on: ubuntu-latest
    steps:
      - name: Consultar métricas por arquivo da PR 108
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          params = urllib.parse.urlencode(
              {
                  "component": "RennaN-C_loadx-smart-logistics",
                  "pullRequest": "108",
                  "metricKeys": (
                      "new_duplicated_lines_density,new_duplicated_lines,"
                      "new_duplicated_blocks,new_lines"
                  ),
                  "strategy": "leaves",
                  "ps": "500",
              }
          )
          url = f"https://sonarcloud.io/api/measures/component_tree?{params}"
          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)

          for component in data.get("components", []):
              measures = {}
              for measure in component.get("measures", []):
                  raw = measure.get("value")
                  if raw is None and measure.get("period"):
                      raw = measure["period"].get("value")
                  measures[measure["metric"]] = raw

              density = float(measures.get("new_duplicated_lines_density") or 0)
              duplicated = float(measures.get("new_duplicated_lines") or 0)
              blocks = float(measures.get("new_duplicated_blocks") or 0)
              if density > 0 or duplicated > 0 or blocks > 0:
                  print(
                      json.dumps(
                          {"path": component.get("path"), "measures": measures},
                          ensure_ascii=False,
                      )
                  )
          PY
