name: Diagnóstico duplicação OC72

on:
  push:
    branches:
      - marlon/oc72-disponibilidade-caminhoes-motoristas

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Ler métricas e blocos duplicados
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://sonarcloud.io/api"
          params = urllib.parse.urlencode({
              "component": "RennaN-C_loadx-smart-logistics",
              "pullRequest": "108",
              "metricKeys": "new_duplicated_lines_density,new_duplicated_lines,new_duplicated_blocks,new_lines,duplicated_lines_density,duplicated_lines,duplicated_blocks",
              "strategy": "leaves",
              "ps": "500",
          })
          with urllib.request.urlopen(f"{base}/measures/component_tree?{params}", timeout=30) as response:
              data = json.load(response)

          print("COMPONENTS", len(data.get("components", [])))
          for component in data.get("components", []):
              if component.get("measures"):
                  print("COMP", json.dumps({
                      "key": component.get("key"),
                      "path": component.get("path"),
                      "measures": component.get("measures"),
                  }, ensure_ascii=False))

          for component in data.get("components", []):
              key = component.get("key")
              if not key:
                  continue
              q = urllib.parse.urlencode({"key": key, "pullRequest": "108"})
              try:
                  with urllib.request.urlopen(f"{base}/duplications/show?{q}", timeout=30) as response:
                      dup = json.load(response)
              except Exception:
                  continue
              if dup.get("duplications"):
                  print("DUP", json.dumps({
                      "key": key,
                      "path": component.get("path"),
                      "duplications": dup.get("duplications"),
                      "files": dup.get("files"),
                  }, ensure_ascii=False))
          PY
