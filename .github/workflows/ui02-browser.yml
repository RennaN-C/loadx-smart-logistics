name: UI02 Browser E2E

on:
  pull_request:
    branches: [desenvolvimento]
    paths: ["backend/qa/browser/**", ".github/workflows/ui02-browser.yml"]

permissions:
  contents: read

jobs:
  browser-ui02:
    name: Chromium e PostgreSQL 16 isolado
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loadx_app
          POSTGRES_USER: loadx_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loadx_ci -d loadx_app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://loadx_ci:local_ci_only@localhost:5432/loadx_app
      TEST_DATABASE_URL: postgresql+psycopg://loadx_ci:local_ci_only@127.0.0.1:5432/loadx_test
      SECRET_KEY: local-only-ui02-test-key-longer-than-thirty-two
      BACKEND_CORS_ORIGINS: http://localhost:5173
      UI02_ARTIFACT_DIR: ui02-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Criar banco exclusivo
        run: PGPASSWORD=local_ci_only psql -h 127.0.0.1 -U loadx_ci -d loadx_app -c 'CREATE DATABASE loadx_test'
      - name: Dependências Python e Playwright
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock.txt
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Dependências do frontend
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Executar Chromium contra API e banco reais
        working-directory: backend
        run: python -m pytest -q qa/browser/test_ui02.py
      - name: Evidências com dados fictícios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui02-browser-evidence
          path: ui02-evidence/
          retention-days: 7
          if-no-files-found: ignore
