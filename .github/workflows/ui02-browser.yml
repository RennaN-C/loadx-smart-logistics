name: UI02 Browser E2E

on:
  pull_request:
    branches: [desenvolvimento]
    paths: ["qa/browser/**", ".github/workflows/ui02-browser.yml"]

permissions:
  contents: read

jobs:
  browser-ui02:
    name: Chromium e PostgreSQL 16 isolado
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: local
      BACKEND_CORS_ORIGINS: http://localhost:5173
      UI02_ARTIFACT_DIR: ${{ github.workspace }}/ui02-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Iniciar PostgreSQL 16 isolado com credenciais efêmeras
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          session_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$session_secret"
          echo "DATABASE_URL=postgresql+psycopg://loadx_ci:${db_password}@127.0.0.1:5432/loadx_app" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+psycopg://loadx_ci:${db_password}@127.0.0.1:5432/loadx_test" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$session_secret" >> "$GITHUB_ENV"
          docker run --detach --name loadx-ui02-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_DB=loadx_app \
            --env POSTGRES_USER=loadx_ci \
            --env "POSTGRES_PASSWORD=$db_password" \
            postgres:16-alpine
          ready=0
          for attempt in $(seq 1 60); do
            if PGPASSWORD="$db_password" pg_isready -h 127.0.0.1 -U loadx_ci -d loadx_app --quiet; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          PGPASSWORD="$db_password" psql -h 127.0.0.1 -U loadx_ci -d loadx_app \
            --set ON_ERROR_STOP=1 --command "CREATE DATABASE loadx_test"

      - name: Dependências Python e Playwright
        run: |
          python -m pip install --only-binary :all: --require-hashes -r backend/requirements-dev.lock.txt
          python -m pip install --only-binary :all: playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Dependências do frontend
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Executar Chromium contra API e banco reais
        run: |
          set -euo pipefail
          (
            cd frontend
            DEV_API_PROXY_TARGET=http://127.0.0.1:8000 npm run dev -- --host 127.0.0.1 --port 5173 --strictPort
          ) > /tmp/loadx-ui02-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          cd backend
          python -m pytest -q ../qa/browser/test_ui02.py
      - name: Evidências com dados fictícios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui02-browser-evidence
          path: ui02-evidence/
          retention-days: 7
          if-no-files-found: ignore
      - name: Remover PostgreSQL isolado
        if: always()
        run: docker rm --force loadx-ui02-postgres || true
