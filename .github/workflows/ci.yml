name: CI

on:
  pull_request:
    branches:
      - desenvolvimento
      - main
  push:
    branches:
      - desenvolvimento
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loadx_test
          POSTGRES_USER: loadx_test
          POSTGRES_PASSWORD: loadx_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loadx_test -d loadx_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://loadx_test:loadx_test_local@localhost:5432/loadx_test
      TEST_DATABASE_URL: postgresql+psycopg://loadx_test:loadx_test_local@127.0.0.1:5432/loadx_test
      SECRET_KEY: ci-only-secret-key-at-least-32-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar Ruff
        run: python -m ruff check .

      - name: Validar formatação com Ruff
        run: python -m ruff format --check .

      - name: Aplicar migrations
        run: python -m alembic upgrade head

      - name: Executar Pytest
        run: python -m pytest -q tests --cov=app --cov-report=term

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

      - name: Executar testes
        run: npm test -- --run

      - name: Gerar build
        run: npm run build
