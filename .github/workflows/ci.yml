name: CI

on:
  pull_request:
    branches:
      - desenvolvimento
      - main
      - versao/v1.2.0
  push:
    branches:
      - desenvolvimento
      - main
      - versao/v1.2.0

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.head_ref == 'release/v1.3.0-loxi' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loadx_test
          POSTGRES_USER: loadx_test
          POSTGRES_PASSWORD: loadx_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loadx_test -d loadx_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://loadx_test:loadx_test_local@localhost:5432/loadx_test
      TEST_DATABASE_URL: postgresql+psycopg://loadx_test:loadx_test_local@127.0.0.1:5432/loadx_test
      SECRET_KEY: ci-only-secret-key-at-least-32-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt

      - name: Instalar dependências
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Executar Ruff
        run: python -m ruff check .

      - name: Validar formatação com Ruff
        run: python -m ruff format --check .

      - name: Aplicar migrations
        run: python -m alembic upgrade head

      - name: Executar Pytest
        run: python -m pytest -q tests --cov=app --cov-report=term

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Executar ESLint
        run: npm run lint

      - name: Executar testes
        run: npm test -- --run

      - name: Gerar build
        run: npm run build

  security-backend:
    name: Segurança do backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Construir imagem do backend
        run: docker build --pull --file backend/Dockerfile --tag loadx-backend:ci backend

      - name: Verificar vulnerabilidades da imagem
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:latest image
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          loadx-backend:ci

  # Publica apos CI interna e SonarCloud do SHA enviado a main.
  # Nunca recebe privilégios de escrita no contexto de pull_request.
  publicar-release:
    name: Publicar release v1.3.0
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, security-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      checks: read
    steps:
      - name: Exigir SonarCloud aprovado neste SHA da main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA_APROVADO: ${{ github.sha }}
        run: |
          set -euo pipefail
          # SonarCloud e check externo, nao faz parte do needs.
          for tentativa in $(seq 1 60); do
            resposta="$(gh api "repos/$GH_REPO/commits/$SHA_APROVADO/check-runs?per_page=100")"
            estado="$(jq -r --arg sha "$SHA_APROVADO" '
              [.check_runs[] | select(
                .head_sha == $sha and
                .name == "SonarCloud Code Analysis" and
                .app.slug == "sonarqubecloud"
              )] | sort_by(.id) | last |
              if . == null or .status != "completed" then "pending"
              else (.conclusion // "failure") end
            ' <<<"$resposta")"
            case "$estado" in
              success) echo "SonarCloud aprovado para $SHA_APROVADO"; exit 0 ;;
              pending) echo "Aguardando SonarCloud ($tentativa/60)"; sleep 20 ;;
              *) echo "::error::SonarCloud reprovou $SHA_APROVADO: $estado"; exit 1 ;;
            esac
          done
          echo "::error::SonarCloud ausente/inconclusivo apos 20 minutos."
          exit 1

      - name: Baixar commit exato da CI
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validar versão e notas
        run: |
          set -euo pipefail
          node -e 'if (require("./frontend/package.json").version !== "1.3.0") process.exit(1)'
          grep -Fq 'version="1.3.0"' backend/app/main.py
          test -s docs/releases/v1.3.0.md

      - name: Criar tag e GitHub Release uma única vez
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA_APROVADO: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view v1.3.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release v1.3.0 já publicada."
            exit 0
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/v1.3.0" >/dev/null 2>&1; then
            echo "::error::Tag já existe sem release; publicação interrompida."
            exit 1
          fi
          gh release create v1.3.0 \
            --repo "$GH_REPO" \
            --target "$SHA_APROVADO" \
            --title "LoadX Smart Logistics v1.3.0 — Loxi e Experiência Inteligente" \
            --notes-file docs/releases/v1.3.0.md \
            --latest
