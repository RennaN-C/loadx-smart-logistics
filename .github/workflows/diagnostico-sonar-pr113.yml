name: Diagnóstico Sonar PR113

on:
  push:
    branches:
      - marlon/modelo-3d-cabine-daf

permissions:
  contents: read

jobs:
  sonar-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar issues do Sonar da PR 113
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          params = urllib.parse.urlencode({
              "componentKeys": "RennaN-C_loadx-smart-logistics",
              "pullRequest": "113",
              "issueStatuses": "OPEN,CONFIRMED",
              "sinceLeakPeriod": "true",
              "ps": "100",
          })
          url = f"https://sonarcloud.io/api/issues/search?{params}"
          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)

          print("TOTAL", data.get("total"))
          for issue in data.get("issues", []):
              print(json.dumps({
                  "key": issue.get("key"),
                  "rule": issue.get("rule"),
                  "severity": issue.get("severity"),
                  "type": issue.get("type"),
                  "component": issue.get("component"),
                  "line": issue.get("line"),
                  "message": issue.get("message"),
                  "textRange": issue.get("textRange"),
                  "flows": issue.get("flows"),
              }, ensure_ascii=False))
          PY
