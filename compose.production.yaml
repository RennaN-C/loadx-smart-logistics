services:
  migrate:
    build: ./backend
    environment:
      APP_ENV: production
      BACKEND_CORS_ORIGINS: "https://${LOADX_DOMAIN:?Defina LOADX_DOMAIN}"
      LOADX_SECRETS_DIR: /run/secrets
    command: python -m alembic upgrade head
    secrets:
      - source: migration_database_url
        target: DATABASE_URL
      - source: secret_key
        target: SECRET_KEY
    networks:
      private:
        ipv4_address: 172.30.0.30
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      BACKEND_CORS_ORIGINS: "https://${LOADX_DOMAIN:?Defina LOADX_DOMAIN}"
      LOADX_SECRETS_DIR: /run/secrets
      PASSWORD_BLOCKLIST_PATH: /run/secrets/PASSWORD_BLOCKLIST
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${BACKEND_WORKERS:-2}"
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.30.0.10
    expose:
      - "8000"
    secrets:
      - source: app_database_url
        target: DATABASE_URL
      - source: secret_key
        target: SECRET_KEY
      - source: password_blocklist
        target: PASSWORD_BLOCKLIST
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      private:
        ipv4_address: 172.30.0.20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_URL: /api/v1
    environment:
      LOADX_DOMAIN: "${LOADX_DOMAIN:?Defina LOADX_DOMAIN}"
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      private:
        ipv4_address: 172.30.0.10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

networks:
  private:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:

secrets:
  app_database_url:
    environment: LOADX_APP_DATABASE_URL
  migration_database_url:
    environment: LOADX_MIGRATION_DATABASE_URL
  secret_key:
    environment: LOADX_SECRET_KEY
  password_blocklist:
    file: ${LOADX_PASSWORD_BLOCKLIST_FILE:-./infra/production/password-blocklist.example.txt}
